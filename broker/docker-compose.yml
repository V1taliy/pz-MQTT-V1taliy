version: '3.8'

services:
  # MQTT Брокер
  mqtt-broker:
    image: eclipse-mosquitto:latest
    container_name: mosquitto-broker
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: always

  # Вебсервер
  web-client:
    image: nginx:alpine
    container_name: nginx-web-client
    ports:
      - "8081:80"
    volumes:
      # Мапплю папку з html-файлами
      - ../client:/usr/share/nginx/html:ro
    restart: always